<VirtualHost *:80>
    ServerName 136.116.64.6
    ServerAdmin webmaster@localhost

    ProxyPreserveHost On
    ProxyRequests Off
    ProxyTimeout 60
    AllowEncodedSlashes NoDecode

    ErrorLog ${APACHE_LOG_DIR}/edupedu-backend-error.log
    CustomLog ${APACHE_LOG_DIR}/edupedu-backend-access.log combined

    # Forward the public request context to Spring Boot.
    RequestHeader set X-Forwarded-Proto "http"
    RequestHeader set X-Forwarded-Port "80"
    RequestHeader set X-Forwarded-Host "136.116.64.6"

    # Browser clients that are allowed to call the API through Apache.
    SetEnvIfNoCase Origin "^https?://(localhost(:[0-9]+)?|127\.0\.0\.1(:[0-9]+)?|136\.116\.64\.6(:[0-9]+)?)$" CORS_ALLOW_ORIGIN=$0

    Header always set Access-Control-Allow-Origin "%{CORS_ALLOW_ORIGIN}e" env=CORS_ALLOW_ORIGIN
    Header always set Access-Control-Allow-Credentials "true" env=CORS_ALLOW_ORIGIN
    Header always set Access-Control-Expose-Headers "Authorization" env=CORS_ALLOW_ORIGIN
    Header always merge Vary "Origin"

    # Let Apache satisfy preflight requests even if the backend build is missing CORS.
    RewriteEngine On
    RewriteCond %{REQUEST_METHOD} =OPTIONS
    RewriteCond %{REQUEST_URI} ^/(api/v1|v3/api-docs|swagger-ui|swagger-ui\.html|webjars|ws-chat)(/.*)?$ [NC]
    RewriteRule ^ - [R=204,END]

    Header always set Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" "expr=%{REQUEST_METHOD} == 'OPTIONS'"
    Header always set Access-Control-Allow-Headers "Authorization, Content-Type, X-Requested-With, Accept, Origin" "expr=%{REQUEST_METHOD} == 'OPTIONS'"
    Header always set Access-Control-Max-Age "3600" "expr=%{REQUEST_METHOD} == 'OPTIONS'"

    # WebSocket upgrade for STOMP chat endpoint.
    RewriteCond %{HTTP:Upgrade} =websocket [NC]
    RewriteCond %{REQUEST_URI} ^/ws-chat(/.*)?$ [NC]
    RewriteRule ^/(.*)$ ws://127.0.0.1:8080/$1 [P,L]

    # SockJS fallback and regular HTTP endpoints.
    ProxyPass        /api/v1/          http://127.0.0.1:8080/api/v1/ retry=0 connectiontimeout=5 timeout=60
    ProxyPassReverse /api/v1/          http://127.0.0.1:8080/api/v1/

    ProxyPass        /v3/api-docs      http://127.0.0.1:8080/v3/api-docs retry=0 connectiontimeout=5 timeout=60
    ProxyPassReverse /v3/api-docs      http://127.0.0.1:8080/v3/api-docs

    ProxyPass        /swagger-ui/      http://127.0.0.1:8080/swagger-ui/ retry=0 connectiontimeout=5 timeout=60
    ProxyPassReverse /swagger-ui/      http://127.0.0.1:8080/swagger-ui/

    ProxyPass        /swagger-ui.html  http://127.0.0.1:8080/swagger-ui.html retry=0 connectiontimeout=5 timeout=60
    ProxyPassReverse /swagger-ui.html  http://127.0.0.1:8080/swagger-ui.html

    ProxyPass        /webjars/         http://127.0.0.1:8080/webjars/ retry=0 connectiontimeout=5 timeout=60
    ProxyPassReverse /webjars/         http://127.0.0.1:8080/webjars/

    ProxyPass        /ws-chat          http://127.0.0.1:8080/ws-chat retry=0 connectiontimeout=5 timeout=60
    ProxyPassReverse /ws-chat          http://127.0.0.1:8080/ws-chat
    ProxyPass        /ws-chat/         http://127.0.0.1:8080/ws-chat/ retry=0 connectiontimeout=5 timeout=60
    ProxyPassReverse /ws-chat/         http://127.0.0.1:8080/ws-chat/

    RedirectMatch 302 ^/$ /swagger-ui/index.html
</VirtualHost>
