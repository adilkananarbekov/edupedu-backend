server:
  port: ${SERVER_PORT:8080}
  forward-headers-strategy: framework

spring:
  application:
    name: app

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
        ddl-auto: ${DDL_AUTO:update}
    show-sql: false
    open-in-view: false
    properties:
        hibernate:
            dialect: org.hibernate.dialect.PostgreSQLDialect
            format_sql: true

  mail:
        host: ${MAIL_HOST}
        port: ${MAIL_PORT}
        username: ${MAIL_USERNAME}
        password: ${MAIL_PASSWORD}
        default-encoding: UTF-8
        properties:
            mail:
                smtp:
                    auth: true
                    starttls:
                        enable: true
                        required: true
                    ssl:
                        trust: ${MAIL_HOST:smtp.gmail.com}
                        protocols: TLSv1.2
                    connectiontimeout: ${MAIL_CONNECTION_TIMEOUT}
                    timeout: ${MAIL_TIMEOUT}
                    writetimeout: ${MAIL_WRITE_TIMEOUT}

app:
  url: ${APP_URL:http://136.116.64.6:8080}
  cors:
    allowed-origin-patterns: ${CORS_ALLOWED_ORIGIN_PATTERNS:http://136.116.64.6:*,https://136.116.64.6:*}
  security:
    jwt:
      private-key-path: ${JWT_PRIVATE_KEY_PATH:keys/local-only/private_key.pem}
      public-key-path: ${JWT_PUBLIC_KEY_PATH:keys/local-only/public_key.pem}
      access-token-expiration: ${ACCESS_TOKEN_EXPIRATION:86400000} #24 hours for local testing #900000 # 15 minutes
      refresh-token-expiration: ${REFRESH_TOKEN_EXPIRATION:604800000} # 7 days
